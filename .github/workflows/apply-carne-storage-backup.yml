name: Apply Carne storage backup update
on:
  push:
    branches: [feature/carne-storage-backup]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/carne-storage-backup
      - name: Apply changes
        shell: python
        run: |
          from pathlib import Path
          p=Path('carne-salud.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace(".install-note{padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--sur2);font-size:13px;line-height:1.45}", ".install-note{padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--sur2);font-size:13px;line-height:1.45}.backup-meta{margin:10px 0 0;padding:9px 11px;border-radius:9px;font-size:12px;line-height:1.4}.backup-meta.ok{background:rgba(63,185,80,.10);color:var(--green)}.backup-meta.warn{background:rgba(210,153,34,.12);color:var(--yellow)}.backup-meta.neutral{background:var(--sur2);color:var(--muted)}")
          old='<p class="muted" style="margin:10px 0 0">💾 Recordá respaldar periódicamente tus datos en Excel.</p>'
          new='<p id="backup-meta" class="backup-meta neutral">💾 Último respaldo: —</p>'
          if old not in s: raise SystemExit('backup UI marker missing')
          s=s.replace(old,new,1)
          old="const INSTALL_HINT_KEY='juegolimpio_carne_install_hint_v1';"
          new=old+"\nconst BACKUP_KEY='juegolimpio_carne_backup_v1';\nconst BACKUP_MAX_AGE_DAYS=14;\nlet persistenceState=null;let persistAttempted=false;"
          if old not in s: raise SystemExit('constants marker missing')
          s=s.replace(old,new,1)
          old="function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}"
          new="function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));renderBackupMeta();maybeRequestPersistentStorage();}\nasync function checkPersistentStorage(){if(!navigator.storage?.persisted)return;try{persistenceState=await navigator.storage.persisted();}catch(e){console.warn('No se pudo comprobar el almacenamiento persistente:',e);}}\nfunction maybeRequestPersistentStorage(){if(persistAttempted||persistenceState===true||!navigator.storage?.persist)return;persistAttempted=true;navigator.storage.persist().then(v=>{persistenceState=v;}).catch(e=>console.warn('No se pudo solicitar almacenamiento persistente:',e));}\nfunction renderBackupMeta(){const box=document.getElementById('backup-meta');if(!box)return;const raw=localStorage.getItem(BACKUP_KEY);if(!raw){if(state.groups.length){box.className='backup-meta warn';box.textContent='⚠️ Todavía no hiciste un respaldo en Excel.';}else{box.className='backup-meta neutral';box.textContent='💾 Último respaldo: —';}return;}const d=new Date(raw);if(Number.isNaN(d.getTime())){localStorage.removeItem(BACKUP_KEY);renderBackupMeta();return;}const age=Math.max(0,Math.floor((Date.now()-d.getTime())/86400000));const date=d.toLocaleDateString('es-UY',{day:'2-digit',month:'2-digit',year:'numeric'});const time=d.toLocaleTimeString('es-UY',{hour:'2-digit',minute:'2-digit'});if(age>=BACKUP_MAX_AGE_DAYS){box.className='backup-meta warn';box.textContent=`⚠️ Último respaldo: ${date} · ${time} (${age} días). Conviene hacer uno nuevo.`;}else{box.className='backup-meta ok';box.textContent=`✅ Último respaldo: ${date} · ${time}`;}}"
          if old not in s: raise SystemExit('save marker missing')
          s=s.replace(old,new,1)
          start=s.index('function exportExcel(){')
          end=s.index('function normalizeHeader',start)
          export_fn="function exportExcel(){if(typeof XLSX==='undefined'){alert('El componente de Excel no está disponible. Cerrá y volvé a abrir la aplicación e intentá nuevamente.');return;}if(!state.groups.length){alert('No hay grupos para exportar.');return;}try{const wb=XLSX.utils.book_new();const used=new Set();state.groups.forEach(g=>{const rows=[['Nº','Nombre','Vencimiento','Días','Estado','Permiso']];g.students.forEach((s,i)=>{const st=statusFor(s.expiry);const perm=s.permission==='ENTREGADO'?'Entregado':s.permission==='NO ENTREGADO'?'No entregado':'Pendiente';rows.push([i+1,s.name,formatDateForExcel(s.expiry),st.days===null?'':st.days,st.label,perm]);});const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=[{wch:6},{wch:30},{wch:14},{wch:10},{wch:16},{wch:16}];XLSX.utils.book_append_sheet(wb,ws,safeSheetName(g.name,used));});const stamp=new Date().toISOString().slice(0,10);XLSX.writeFile(wb,`juego-limpio-carne-salud-${stamp}.xlsx`);localStorage.setItem(BACKUP_KEY,new Date().toISOString());renderBackupMeta();maybeRequestPersistentStorage();}catch(e){console.error(e);alert('No se pudo generar el respaldo en Excel. Intentá nuevamente.');}}\n"
          s=s[:start]+export_fn+s[end:]
          s=s.replace("if(typeof XLSX==='undefined'){alert('El lector de Excel no está disponible. Conectate a Internet, recargá la app una vez e intentá nuevamente.');return;}","if(typeof XLSX==='undefined'){alert('El componente de Excel no está disponible. Cerrá y volvé a abrir la aplicación e intentá nuevamente.');return;}",1)
          old="document.getElementById('new-group').addEventListener('keydown',e=>{if(e.key==='Enter')createGroup();});renderGroups();maybeShowInstallHint();"
          new="document.getElementById('new-group').addEventListener('keydown',e=>{if(e.key==='Enter')createGroup();});renderGroups();renderBackupMeta();checkPersistentStorage();maybeShowInstallHint();"
          if old not in s: raise SystemExit('init marker missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          sw=Path('sw-carne-salud.js')
          t=sw.read_text(encoding='utf-8')
          if 'juegolimpio-carne-salud-v3' not in t: raise SystemExit('cache marker missing')
          sw.write_text(t.replace('juegolimpio-carne-salud-v3','juegolimpio-carne-salud-v4',1),encoding='utf-8')
      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re,pathlib
          s=pathlib.Path('carne-salud.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          pathlib.Path('/tmp/carne-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/carne-inline.js
          node --check sw-carne-salud.js
          git add carne-salud.html sw-carne-salud.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add persistent storage and backup age warning'
          git push origin HEAD:feature/carne-storage-backup
