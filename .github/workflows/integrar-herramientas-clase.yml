name: Integrar herramientas de clase
on:
  push:
    branches: [feature/herramientas-clase]
    paths: [.github/workflows/integrar-herramientas-clase.yml]
permissions:
  contents: write
jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/herramientas-clase
      - name: Agregar acceso desde inicio
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='''    <button class="hbtn hf" onclick="goTo('torneo')">\n      <div class="hicon">📊</div>\n      <div class="hinfo">\n        <strong>Torneo Fácil</strong>\n        <span>Fixture · Tabla Deportiva y Conductual</span>\n      </div>\n    </button>'''
          new=old+'''\n    <span class="tool-section-label" style="margin-top:4px;">Herramientas de clase</span>\n    <button class="hbtn" style="border-left:5px solid var(--warn);" onclick="location.href='herramientas.html'">\n      <div class="hicon">👥</div>\n      <div class="hinfo">\n        <strong>Armador de equipos</strong>\n        <span>Sorteo rápido · Grupos equilibrados</span>\n      </div>\n    </button>'''
          if old not in s:
              raise SystemExit('No se encontró el bloque de Torneo Fácil')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - run: git diff --check
      - name: Guardar cambio
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Integrate classroom tools into home"
          git push
