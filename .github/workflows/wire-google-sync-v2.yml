name: Wire Google Sheets sync V2
on:
  push:
    branches: [feature/google-sheets-sync-v2]
    paths: [.github/workflows/wire-google-sync-v2.yml]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/google-sheets-sync-v2
      - name: Connect sync module safely
        shell: python
        run: |
          from pathlib import Path

          p=Path('carne-salud.html')
          s=p.read_text(encoding='utf-8')
          old="let state=loadState();\nlet currentGroupId=null;"
          new="let state=loadState();\nwindow.jlGetState=()=>state;\nwindow.jlReplaceState=next=>{state=normalizeState(next);};\nlet currentGroupId=null;"
          if old not in s: raise SystemExit('state anchor not found')
          s=s.replace(old,new,1)
          old="function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}"
          new="function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));window.jlAfterLocalSave?.();}"
          if old not in s: raise SystemExit('save anchor not found')
          s=s.replace(old,new,1)
          if '<script src="google-sync.js"></script>' not in s:
              s=s.replace('</body>','<script src="google-sync.js"></script>\n</body>',1)
          p.write_text(s,encoding='utf-8')

          p=Path('google-sync.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("Array.isArray(window.state?.groups)&&window.state.groups.length>0","Array.isArray(window.jlGetState?.()?.groups)&&window.jlGetState().groups.length>0")
          s=s.replace("(window.state?.groups||[])","(window.jlGetState?.()?.groups||[])")
          s=s.replace("if(window.state?.groups?.length && !confirm", "if(window.jlGetState?.()?.groups?.length && !confirm")
          s=s.replace("window.state=await readSnapshot(file.id);save();renderGroups();", "window.jlReplaceState(await readSnapshot(file.id));save();renderGroups();")
          old="""  function wrapLocalSave(){\n    if(typeof window.save!=='function')return;\n    const localSave=window.save;\n    window.save=function(){const r=localSave.apply(this,arguments);scheduleSync();return r;};\n  }\n\n  injectStyles();injectCard();wrapLocalSave();"""
          new="""  function installSaveHook(){window.jlAfterLocalSave=scheduleSync;}\n\n  injectStyles();injectCard();installSaveHook();"""
          if old not in s: raise SystemExit('save hook anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Verify prototype
        shell: bash
        run: |
          node --check google-sync.js
          grep -q 'window.jlGetState' carne-salud.html
          grep -q 'window.jlAfterLocalSave' carne-salud.html
          grep -q '<script src="google-sync.js"></script>' carne-salud.html
          grep -q 'PENDIENTE_CONFIGURAR_CLIENT_ID' google-sync.js
          git diff --check
      - name: Clean workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/wire-google-sync-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire Google Sheets sync prototype"
          git push
