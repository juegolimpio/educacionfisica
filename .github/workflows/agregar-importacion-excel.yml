name: Agregar importación de Excel
on:
  push:
    branches: [feature/carne-salud-local]
    paths: [.github/workflows/agregar-importacion-excel.yml]
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/carne-salud-local
      - name: Incorporar importación de Excel
        shell: python
        run: |
          from pathlib import Path
          p=Path('carne-salud.html')
          s=p.read_text(encoding='utf-8')

          marker='</style>\n</head>'
          replacement='</style>\n<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>\n</head>'
          if 'cdn.sheetjs.com/xlsx-0.20.3' not in s:
              if marker not in s: raise SystemExit('No se encontró cierre de estilos')
              s=s.replace(marker,replacement,1)

          old='''        <button class="btn" onclick="exportBackup()">💾 Exportar respaldo</button>\n        <button class="btn" onclick="document.getElementById('import-file').click()">📂 Importar respaldo</button>\n        <input id="import-file" class="hidden" type="file" accept="application/json,.json" onchange="importBackup(event)">'''
          new='''        <button class="btn" onclick="exportBackup()">💾 Exportar respaldo</button>\n        <button class="btn" onclick="document.getElementById('import-file').click()">📂 Importar respaldo</button>\n        <button class="btn" onclick="document.getElementById('excel-file').click()">📊 Importar Excel</button>\n        <input id="import-file" class="hidden" type="file" accept="application/json,.json" onchange="importBackup(event)">\n        <input id="excel-file" class="hidden" type="file" accept=".xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" onchange="importExcel(event)">'''
          if 'id="excel-file"' not in s:
              if old not in s: raise SystemExit('No se encontró bloque de respaldo')
              s=s.replace(old,new,1)

          insert='''
function normalizeHeader(v){return String(v??'').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').trim().toLowerCase();}
function uniqueGroupName(name){let base=String(name||'Grupo').trim().slice(0,60)||'Grupo';let candidate=base,n=2;const used=new Set(state.groups.map(g=>g.name.toLowerCase()));while(used.has(candidate.toLowerCase()))candidate=`${base} (${n++})`;return candidate.slice(0,60);}
function excelDateToISO(value){
  if(value===null||value===undefined||value==='')return '';
  if(value instanceof Date&&!isNaN(value)){const y=value.getFullYear(),m=String(value.getMonth()+1).padStart(2,'0'),d=String(value.getDate()).padStart(2,'0');return `${y}-${m}-${d}`;}
  if(typeof value==='number'&&window.XLSX?.SSF){const parsed=XLSX.SSF.parse_date_code(value);if(parsed)return `${String(parsed.y).padStart(4,'0')}-${String(parsed.m).padStart(2,'0')}-${String(parsed.d).padStart(2,'0')}`;}
  const text=String(value).trim();
  if(/^\\d{4}-\\d{2}-\\d{2}/.test(text))return text.slice(0,10);
  const m=text.match(/^(\\d{1,2})[\\/.\\-](\\d{1,2})[\\/.\\-](\\d{2,4})$/);if(m){let y=Number(m[3]);if(y<100)y+=2000;return `${String(y).padStart(4,'0')}-${String(Number(m[2])).padStart(2,'0')}-${String(Number(m[1])).padStart(2,'0')}`;}
  return '';
}
function permissionFromExcel(value){const v=normalizeHeader(value).toUpperCase();if(['SI','ENTREGADO','TRUE','1'].includes(v))return 'ENTREGADO';if(['NO','NO ENTREGADO','FALSE','0'].includes(v))return 'NO ENTREGADO';return 'PENDIENTE';}
async function importExcel(event){
  const file=event.target.files?.[0];event.target.value='';if(!file)return;
  if(typeof XLSX==='undefined'){alert('No se pudo cargar el lector de Excel. Verificá tu conexión a Internet e intentá nuevamente.');return;}
  try{
    const workbook=XLSX.read(await file.arrayBuffer(),{cellDates:true});
    const hasNonTemplate=workbook.SheetNames.some(n=>normalizeHeader(n)!=='plantilla');
    const imported=[];
    for(const sheetName of workbook.SheetNames){
      if(hasNonTemplate&&normalizeHeader(sheetName)==='plantilla')continue;
      const ws=workbook.Sheets[sheetName];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true});
      let headerRow=-1,nameIdx=-1,expiryIdx=-1,permissionIdx=-1;
      for(let r=0;r<Math.min(rows.length,10);r++){
        const headers=(rows[r]||[]).map(normalizeHeader);
        const ni=headers.indexOf('nombre');
        if(ni>=0){headerRow=r;nameIdx=ni;expiryIdx=headers.indexOf('vencimiento');permissionIdx=headers.indexOf('permiso');break;}
      }
      if(headerRow<0)continue;
      const students=[];
      for(let r=headerRow+1;r<rows.length;r++){
        const row=rows[r]||[];const name=String(row[nameIdx]??'').trim();if(!name)continue;
        students.push({id:uid(),name:name.slice(0,120),expiry:expiryIdx>=0?excelDateToISO(row[expiryIdx]):'',permission:permissionIdx>=0?permissionFromExcel(row[permissionIdx]):'PENDIENTE'});
      }
      if(students.length)imported.push({id:uid(),name:uniqueGroupName(sheetName),students});
    }
    if(!imported.length){alert('No encontré hojas con una columna “Nombre” y alumnos para importar.');return;}
    const total=imported.reduce((n,g)=>n+g.students.length,0);
    if(!confirm(`Se agregarán ${imported.length} grupo(s) y ${total} alumno(s) desde el Excel.\\n\\nSe leerán Nombre, Vencimiento y Permiso. La Cédula, Días y Estado no se importarán.\\n\\n¿Continuar?`))return;
    state.groups.push(...imported);save();renderGroups();
    alert(`Excel importado correctamente: ${imported.length} grupo(s), ${total} alumno(s).`);
  }catch(e){console.error(e);alert('No se pudo leer el Excel. Verificá que sea un archivo .xlsx o .xls válido.');}
}
'''
          anchor='function renderBackupMeta(){'
          if 'async function importExcel(event)' not in s:
              if anchor not in s: raise SystemExit('No se encontró punto de inserción')
              s=s.replace(anchor,insert+'\n'+anchor,1)

          p.write_text(s,encoding='utf-8')
      - name: Verificar cambios
        shell: bash
        run: |
          git diff --check
          grep -q 'Importar Excel' carne-salud.html
          grep -q 'async function importExcel' carne-salud.html
          grep -q 'xlsx-0.20.3' carne-salud.html
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('carne-salud.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?![^>]*src=)[^>]*>(.*?)</script>',s,flags=re.S|re.I)
          Path('/tmp/carne-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/carne-inline.js
      - name: Guardar cambio
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add carne-salud.html
          git commit -m "Add Excel import for health card groups"
          git push
