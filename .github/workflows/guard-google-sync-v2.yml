name: Guard Google sync conflicts
on:
  push:
    branches: [feature/google-sheets-sync-v2]
    paths: [.github/workflows/guard-google-sync-v2.yml]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/google-sheets-sync-v2
      - name: Add explicit sync decision guard
        shell: python
        run: |
          from pathlib import Path
          p=Path('google-sync.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("  let pendingSync = false;", "  let pendingSync = false;\n  let autoSyncEnabled = false;")
          s=s.replace("        setStatus('wait','Google conectado · todavía no hay hoja');", "        autoSyncEnabled=false;\n        setStatus('wait','Google conectado · todavía no hay hoja');")
          s=s.replace("      setStatus('ok','Google conectado · hoja encontrada');\n      show('google-create-btn',false);show('google-sync-btn',true);", "      autoSyncEnabled=false;\n      setStatus('ok','Google conectado · hoja encontrada');\n      show('google-create-btn',false);show('google-sync-btn',false);")
          s=s.replace("      await writeSnapshot(file.id);\n      show('google-create-btn',false);", "      await writeSnapshot(file.id);\n      autoSyncEnabled=true;\n      show('google-create-btn',false);")
          s=s.replace("      window.jlReplaceState(await readSnapshot(file.id));save();renderGroups();\n      setStatus('ok','Datos recuperados desde Google ✓');", "      window.jlReplaceState(await readSnapshot(file.id));\n      autoSyncEnabled=true;\n      save();renderGroups();\n      setStatus('ok','Datos recuperados desde Google ✓');")
          s=s.replace("      await writeSnapshot(file.id);\n      setStatus('ok','Guardado en Google Sheets ✓');", "      await writeSnapshot(file.id);\n      autoSyncEnabled=true;\n      setStatus('ok','Guardado en Google Sheets ✓');")
          s=s.replace("    if(!accessToken||!localStorage.getItem(LS_FILE_ID))return;", "    if(!autoSyncEnabled||!accessToken||!localStorage.getItem(LS_FILE_ID))return;")
          p.write_text(s,encoding='utf-8')
      - name: Verify guard
        shell: bash
        run: |
          node --check google-sync.js
          grep -q 'let autoSyncEnabled = false' google-sync.js
          grep -q "if(!autoSyncEnabled||!accessToken" google-sync.js
          git diff --check
      - name: Clean workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/guard-google-sync-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Guard Google sync against accidental overwrite"
          git push
