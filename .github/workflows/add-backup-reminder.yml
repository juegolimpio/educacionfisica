name: Add backup reminder
on:
  push:
    branches:
      - chore/recordatorio-respaldo-excel
    paths:
      - .github/workflows/add-backup-reminder.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/recordatorio-respaldo-excel
      - name: Add reminder
        shell: python
        run: |
          from pathlib import Path
          p = Path('carne-salud.html')
          s = p.read_text(encoding='utf-8')
          old = '''        <input id="excel-file" class="hidden" type="file" accept=".xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" onchange="importExcel(event)">\n      </div>'''
          new = '''        <input id="excel-file" class="hidden" type="file" accept=".xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" onchange="importExcel(event)">\n      </div>\n      <p class="muted" style="margin:10px 0 0">💾 Recordá respaldar periódicamente tus datos en Excel.</p>'''
          if old not in s:
              raise SystemExit('Expected Excel controls block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Verify
        shell: bash
        run: |
          grep -q 'Recordá respaldar periódicamente tus datos en Excel' carne-salud.html
          git diff --check
      - name: Clean workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/add-backup-reminder.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Excel backup reminder"
          git push
