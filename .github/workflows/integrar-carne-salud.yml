name: Integrar carné de salud
on:
  push:
    branches: [feature/carne-salud-local]
    paths: [.github/workflows/integrar-carne-salud.yml]
permissions:
  contents: write
jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/carne-salud-local
      - name: Agregar acceso desde inicio
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='''    <button class="hbtn" style="border-left:5px solid var(--warn);" onclick="location.href='herramientas.html'">\n      <div class="hicon">👥</div>\n      <div class="hinfo">\n        <strong>Armador de equipos</strong>\n        <span>Sorteo rápido · Grupos equilibrados</span>\n      </div>\n    </button>'''
          new=old+'''\n    <button class="hbtn" style="border-left:5px solid var(--red);" onclick="location.href='carne-salud.html'">\n      <div class="hicon">🩺</div>\n      <div class="hinfo">\n        <strong>Carné de salud y permisos</strong>\n        <span>Grupos · Vencimientos · Permisos · Respaldo</span>\n      </div>\n    </button>'''
          if old not in s:
              raise SystemExit('No se encontró el bloque de Herramientas de clase')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - run: git diff --check
      - name: Guardar cambio
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Integrate health card tool into home"
          git push
