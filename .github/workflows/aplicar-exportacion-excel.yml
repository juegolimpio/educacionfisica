name: Aplicar exportacion Excel
on:
  push:
    branches:
      - feature/carne-salud-local
    paths:
      - .github/workflows/aplicar-exportacion-excel.yml
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/carne-salud-local
      - name: Aplicar parche
        run: python scripts/patch_excel_export.py
      - name: Verificar sintaxis
        run: |
          git diff --check
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('carne-salud.html').read_text(encoding='utf-8')
          assert 'Exportar Excel' in s
          assert 'function exportExcel' in s
          scripts=re.findall(r'<script(?![^>]*src=)[^>]*>(.*?)</script>',s,flags=re.S|re.I)
          Path('/tmp/carne-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/carne-inline.js
      - name: Guardar cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add carne-salud.html
          git commit -m "Add Excel export for health card data"
          git push
