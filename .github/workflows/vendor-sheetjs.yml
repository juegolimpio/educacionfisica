name: Vendor SheetJS 0.20.3 (temporary)

on:
  push:
    branches:
      - feature/carne-salud-pwa

permissions:
  contents: write

jobs:
  vendor-sheetjs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/carne-salud-pwa

      - name: Download and verify SheetJS 0.20.3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor
          curl --fail --location --retry 3 \
            https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js \
            --output vendor/xlsx.full.min.js
          echo '6b3130af1ceadf07caa0ec08af7addff  vendor/xlsx.full.min.js' | md5sum --check --strict
          grep -q 'version="0.20.3"\|version="0.20.3"\|version='"'"'0.20.3'"'"'' vendor/xlsx.full.min.js || true

      - name: Commit vendored library
        shell: bash
        run: |
          set -euo pipefail
          git add vendor/xlsx.full.min.js
          if git diff --cached --quiet; then
            echo 'SheetJS is already vendored.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Vendor SheetJS 0.20.3'
          git push origin HEAD:feature/carne-salud-pwa
