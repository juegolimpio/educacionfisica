name: Apply Torneo Facil audit fixes

on:
  push:
    branches:
      - fix/torneo-facil-auditoria
    paths:
      - scripts/fix-torneo.js
      - .github/workflows/apply-torneo-audit-fixes.yml

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/torneo-facil-auditoria

      - name: Repair embedded template literals
        shell: bash
        run: |
          python - <<'PY'
          p='scripts/fix-torneo.js'
          s=open(p,encoding='utf-8').read()
          s=s.replace("tfElimWinner(pA, `elim_${r-1}_${i*2}`)", "tfElimWinner(pA, 'elim_'+(r-1)+'_'+(i*2))")
          s=s.replace("tfElimWinner(pB, `elim_${r-1}_${i*2+1}`)", "tfElimWinner(pB, 'elim_'+(r-1)+'_'+(i*2+1))")
          open(p,'w',encoding='utf-8').write(s)
          PY

      - name: Apply audited fixes
        run: node scripts/fix-torneo.js

      - name: Validate diff
        run: git diff --check

      - name: Commit patched index
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix Torneo Facil audit findings"
          git push
