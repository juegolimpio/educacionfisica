<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Herramientas de clase - Juego Limpio</title>
<style>
:root{color-scheme:dark;--bg:#0d1117;--sur:#161b22;--sur2:#21262d;--text:#e6edf3;--muted:#8b949e;--border:#30363d;--accent:#d29922;--ok:#3fb950;--red:#f85149}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--sur);border-bottom:1px solid var(--border);position:sticky;top:0}header a{color:var(--text);text-decoration:none;font-size:22px}.wrap{max-width:760px;margin:auto;padding:20px}.card{background:var(--sur);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px}h1{font-size:22px;margin:0 0 6px}p{color:var(--muted);font-size:14px;line-height:1.45}.label{display:block;color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;margin:14px 0 6px}textarea,select{width:100%;background:var(--sur2);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:12px;font:inherit}textarea{min-height:210px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.count{background:var(--sur2);border:1px solid var(--border);border-radius:10px;padding:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}button{border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text)}button.primary{background:var(--accent);border-color:var(--accent);color:#0d1117}.msg{display:none;color:var(--red);font-size:13px;margin-top:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.team{background:var(--sur);border:1px solid var(--border);border-radius:12px;overflow:hidden}.team h2{font-size:15px;margin:0;padding:10px 12px;background:var(--sur2)}.team ol{margin:0;padding:12px 12px 14px 34px}.team li{padding:3px 0}.ok{display:none;color:var(--ok);font-size:13px;font-weight:700;margin-top:10px}@media(max-width:560px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><a href="index.html" aria-label="Volver">←</a><strong>👥 Herramientas de clase</strong></header>
<main class="wrap">
<section class="card">
<h1>Armador de equipos</h1>
<p>Ingresá un nombre por línea. La herramienta mezcla la lista y reparte a los participantes de forma equilibrada.</p>
<label class="label" for="names">Estudiantes / participantes</label>
<textarea id="names" placeholder="Ana&#10;Bruno&#10;Camila&#10;Diego"></textarea>
<div class="row">
<div><label class="label" for="teams">Cantidad de equipos</label><select id="teams"><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></div>
<div><span class="label">Participantes válidos</span><div class="count" id="count">0</div></div>
</div>
<div class="actions"><button class="primary" id="build">🎲 Armar equipos</button><button id="again">↻ Volver a sortear</button><button id="clear">🗑 Limpiar</button></div>
<div class="msg" id="msg"></div>
</section>
<section class="card" id="resultsCard" hidden>
<div class="actions" style="justify-content:space-between;align-items:center;margin-top:0"><div><strong>Equipos generados</strong><div id="summary" style="color:var(--muted);font-size:13px;margin-top:3px"></div></div><button id="copy">📋 Copiar</button></div>
<div class="grid" id="results"></div><div class="ok" id="ok">✓ Equipos copiados</div>
</section>
</main>
<script>
const KEY='juegolimpio_herramientas_v1';let generated=[];
const $=id=>document.getElementById(id);
function names(){const seen=new Set(),out=[];$('names').value.split(/\r?\n/).forEach(v=>{const n=v.trim().replace(/\s+/g,' '),k=n.toLocaleLowerCase('es');if(n&&!seen.has(k)){seen.add(k);out.push(n)}});return out}
function save(){localStorage.setItem(KEY,JSON.stringify({names:$('names').value,teams:Number($('teams').value)}));$('count').textContent=names().length}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function build(){const list=names(),n=Number($('teams').value);$('msg').style.display='none';if(list.length<n){$('msg').textContent='Necesitás al menos una persona por equipo.';$('msg').style.display='block';$('resultsCard').hidden=true;return}generated=Array.from({length:n},()=>[]);shuffle(list).forEach((x,i)=>generated[i%n].push(x));$('results').innerHTML=generated.map((t,i)=>`<section class="team"><h2>Equipo ${i+1} (${t.length})</h2><ol>${t.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></section>`).join('');$('summary').textContent=`${list.length} participantes · ${n} equipos`;$('resultsCard').hidden=false;save()}
function copy(){if(!generated.length)return;const txt=generated.map((t,i)=>`EQUIPO ${i+1}\n${t.map((x,j)=>`${j+1}. ${x}`).join('\n')}`).join('\n\n');const done=()=>{$('ok').style.display='block';setTimeout(()=>$('ok').style.display='none',2000)};if(navigator.clipboard?.writeText)navigator.clipboard.writeText(txt).then(done);else{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();done()}}
$('names').addEventListener('input',save);$('teams').addEventListener('change',save);$('build').onclick=build;$('again').onclick=build;$('copy').onclick=copy;$('clear').onclick=()=>{if(confirm('¿Limpiar la lista y los equipos generados?')){$('names').value='';$('teams').value='2';generated=[];$('resultsCard').hidden=true;save()}};
try{const s=JSON.parse(localStorage.getItem(KEY)||'{}');if(typeof s.names==='string')$('names').value=s.names;if([2,3,4,5,6].includes(Number(s.teams)))$('teams').value=s.teams}catch(e){}save();
</script>
</body></html>
